server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Giọng đọc tiếng Việt online cho máy không có giọng vi-VN
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  location = /api/tts {
    proxy_pass https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q=$arg_q;
    proxy_ssl_server_name on;
    proxy_set_header Host translate.google.com;
    proxy_set_header User-Agent "Mozilla/5.0";
    proxy_set_header Referer "https://translate.google.com/";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=86400";
  }

  # SPA: mọi route trả về index.html
  location / {
    try_files $uri /index.html;
  }
}
